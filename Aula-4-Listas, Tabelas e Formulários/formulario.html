<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required><br><br>
            </p>
            <p><label>Senha:</label>
            <input type="password" name="senha" required maxlength="8"><br><br>
            </p>
            <p><Label>Telefone:</Label>
                <input type="text" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                placeholder=" (99) 99999-9999" required><br><br>
            </p>
            <p><Label>CEP:</Label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="99999-999" required><br><br>
                <title>Use o formato: 00000-000</title>
            </p>
            <p><Label>Sobre você:</Label>
                <textarea name="bio" rows="10" cols="100"></textarea>
            </p>
            <p><Label>Gênero:</Label>
                <input type="radio" name="genero" value="M">Masculino
                <input type="radio" name="genero" value="F">Feminino
            </p>
            <p><Label>Interesses:</Label>
                <input type="checkbox" name="interesses" value="Esportes">Esportes
                <input type="checkbox" name="interesses" value="Artes">Artes
                <input type="checkbox" name="interesses" value="Tecnologia">Tecnologia
            </p>
            <p><Label>País:</Label>
                <Select name="pais">
                    <option value="">---</option>
                    <option value="Brasil">Brasil</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Chile">Chile</option>
                </Select>
            </p>
            <p><label>Foto de perfil:</label>
                <input type="file" name="foto">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section> 
</body>
</html>
